<app-page-header title="Documents">
  <app-button variant="primary" (clicked)="navigateToUpload()">
    Ajouter un document
  </app-button>
</app-page-header>

<div class="document-list-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (documents().length === 0) {
    <app-empty-state
      icon="document"
      title="Aucun document"
      description="Aucun document disponible pour le moment."
      actionLabel="Ajouter un document"
      (action)="navigateToUpload()"
    />
  } @else {
    <div class="document-grid">
      @for (doc of documents(); track doc.id) {
        <app-card class="document-card" (click)="navigateToViewer(doc.id)">
          <div class="card-body">
            <h3 class="document-name">{{ doc.name }}</h3>
            <p class="document-type">{{ doc.type }}</p>
          </div>
        </app-card>
      }
    </div>
  }
</div>
