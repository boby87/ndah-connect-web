<app-page-header title="Sanctions" />

<div class="sanction-list-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (sanctions().length === 0) {
    <app-empty-state
      icon="shield-exclamation"
      title="Aucune sanction"
      description="Aucune sanction enregistrée pour le moment."
    />
  } @else {
    <div class="sanction-grid">
      @for (sanction of sanctions(); track sanction.id) {
        <app-card class="sanction-card" (click)="navigateToDetail(sanction.id)">
          <div class="card-body">
            <h3 class="sanction-type">{{ sanction.type }}</h3>
            <p class="sanction-reason">{{ sanction.reason }}</p>
            <div class="sanction-meta">
              <span class="amount">{{ sanction.amount | number }} XAF</span>
              <span class="status">{{ sanction.status }}</span>
            </div>
          </div>
        </app-card>
      }
    </div>
  }
</div>
