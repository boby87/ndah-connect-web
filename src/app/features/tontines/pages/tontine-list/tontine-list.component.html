<app-page-header title="Mes tontines">
  <app-button variant="primary" (clicked)="navigateToCreate()">
    Nouvelle tontine
  </app-button>
</app-page-header>

<div class="tontine-list-container">
  <div class="search-section">
    <app-search-input
      placeholder="Rechercher une tontine..."
      (searchChange)="onSearch($event)"
    />
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (tontines().length === 0) {
    <app-empty-state
      icon="users"
      title="Aucune tontine"
      description="Vous n'avez rejoint aucune tontine pour le moment."
      actionLabel="Créer une tontine"
      (action)="navigateToCreate()"
    />
  } @else {
    <div class="tontine-grid">
      @for (tontine of tontines(); track tontine.id) {
        <app-card class="tontine-card" (click)="navigateToDetail(tontine.id)">
          <div class="card-body">
            <h3 class="tontine-name">{{ tontine.name }}</h3>
            <p class="tontine-description">{{ tontine.description }}</p>
            <div class="tontine-meta">
              <span class="contribution-amount">{{ tontine.contributionAmount | number }} XAF</span>
              <span class="frequency">{{ tontine.frequency }}</span>
            </div>
          </div>
        </app-card>
      }
    </div>
  }
</div>
