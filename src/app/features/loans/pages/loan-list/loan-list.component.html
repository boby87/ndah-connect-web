<app-page-header title="Prêts">
  <app-button variant="primary" (clicked)="navigateToRequest()">
    Demander un prêt
  </app-button>
</app-page-header>

<div class="loan-list-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (loans().length === 0) {
    <app-empty-state
      icon="banknotes"
      title="Aucun prêt"
      description="Aucun prêt enregistré pour le moment."
      actionLabel="Demander un prêt"
      (action)="navigateToRequest()"
    />
  } @else {
    <div class="loan-grid">
      @for (loan of loans(); track loan.id) {
        <app-card class="loan-card" (click)="navigateToDetail(loan.id)">
          <div class="card-body">
            <h3 class="loan-amount">{{ loan.amount | number }} XAF</h3>
            <p class="loan-member">{{ loan.member?.user?.firstName }} {{ loan.member?.user?.lastName }}</p>
            <div class="loan-meta">
              <span class="interest-rate">{{ loan.interestRate }}%</span>
              <span class="status">{{ loan.status }}</span>
            </div>
          </div>
        </app-card>
      }
    </div>
  }
</div>
