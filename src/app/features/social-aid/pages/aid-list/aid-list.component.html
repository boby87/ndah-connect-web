<app-page-header title="Aide sociale">
  <app-button variant="primary" (clicked)="navigateToRequest()">
    Nouvelle demande
  </app-button>
</app-page-header>

<div class="aid-list-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (aids().length === 0) {
    <app-empty-state
      icon="heart"
      title="Aucune aide sociale"
      description="Aucune demande d'aide sociale pour le moment."
      actionLabel="Faire une demande"
      (action)="navigateToRequest()"
    />
  } @else {
    <div class="aid-grid">
      @for (aid of aids(); track aid.id) {
        <app-card class="aid-card">
          <div class="card-body">
            <h3 class="aid-title">{{ aid.title }}</h3>
            <p class="aid-description">{{ aid.description }}</p>
            <span class="aid-status">{{ aid.status }}</span>
          </div>
        </app-card>
      }
    </div>
  }
</div>
