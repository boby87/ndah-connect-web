<app-page-header title="Notifications" />

<div class="notification-list-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (notifications().length === 0) {
    <app-empty-state
      icon="bell"
      title="Aucune notification"
      description="Vous n'avez aucune notification pour le moment."
    />
  } @else {
    <div class="notification-list">
      @for (notification of notifications(); track notification.id) {
        <app-card class="notification-item" [class.unread]="!notification.isRead">
          <div class="card-body">
            <h3 class="notification-title">{{ notification.title }}</h3>
            <p class="notification-body">{{ notification.body }}</p>
            <span class="notification-date">{{ notification.createdAt }}</span>
          </div>
        </app-card>
      }
    </div>
  }
</div>
