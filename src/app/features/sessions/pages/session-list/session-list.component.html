<app-page-header title="Séances">
  <app-button variant="primary" (clicked)="navigateToCreate()">
    Nouvelle séance
  </app-button>
</app-page-header>

<div class="session-list-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (sessions().length === 0) {
    <app-empty-state
      icon="calendar"
      title="Aucune séance"
      description="Aucune séance programmée pour le moment."
      actionLabel="Planifier une séance"
      (action)="navigateToCreate()"
    />
  } @else {
    <div class="session-grid">
      @for (session of sessions(); track session.id) {
        <app-card class="session-card" (click)="navigateToDetail(session.id)">
          <div class="card-body">
            <h3 class="session-title">Séance #{{ session.number }}</h3>
            <p class="session-date">{{ session.scheduledDate }}</p>
            <span class="session-status">{{ session.status }}</span>
          </div>
        </app-card>
      }
    </div>
  }
</div>
