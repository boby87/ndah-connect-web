<app-page-header title="Membres" />

<div class="member-list-container">
  <div class="search-section">
    <app-search-input
      placeholder="Rechercher un membre..."
      (searchChange)="onSearch($event)"
    />
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else if (members().length === 0) {
    <app-empty-state
      icon="users"
      title="Aucun membre"
      description="Aucun membre trouvé dans cette tontine."
    />
  } @else {
    <div class="member-grid">
      @for (member of members(); track member.id) {
        <app-card class="member-card" (click)="navigateToDetail(member.id)">
          <div class="card-body">
            <h3 class="member-name">{{ member.user.firstName }} {{ member.user.lastName }}</h3>
            <p class="member-role">{{ member.role }}</p>
            <span class="member-status">{{ member.status }}</span>
          </div>
        </app-card>
      }
    </div>
  }
</div>
