<div class="forgot-password-page">
  <h2 class="auth-heading">Mot de passe oublié</h2>
  <p class="auth-subheading">Entrez votre numéro pour recevoir un code de réinitialisation</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    <app-form-field label="Numéro de téléphone" [required]="true">
      <app-phone-input formControlName="phoneNumber" />
    </app-form-field>

    <app-button type="submit" variant="primary" [fullWidth]="true" [loading]="isLoading" [disabled]="form.invalid">
      Envoyer le code
    </app-button>
  </form>

  <p class="auth-footer-text">
    <a routerLink="/auth/login" class="auth-link">← Retour à la connexion</a>
  </p>
</div>
