<div class="verify-otp-page">
  <h2 class="auth-heading">Vérification OTP</h2>
  <p class="auth-subheading">Un code a été envoyé au +237 {{ phone }}</p>

  <div class="otp-section">
    <app-otp-input (completed)="onOtpComplete($event)" />
  </div>

  <div class="resend-section">
    @if (canResend()) {
      <app-button variant="ghost" (clicked)="resendOtp()">Renvoyer le code</app-button>
    } @else {
      <p class="timer-text">Renvoyer dans {{ timer() }}s</p>
    }
  </div>
</div>
