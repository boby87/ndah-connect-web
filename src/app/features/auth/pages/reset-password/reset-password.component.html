<div class="reset-password-page">
  <h2 class="auth-heading">Réinitialiser le mot de passe</h2>
  <p class="auth-subheading">Entrez le code reçu et votre nouveau mot de passe</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    <app-form-field label="Code de vérification" [required]="true">
      <app-input formControlName="code" placeholder="Entrez le code à 6 chiffres" />
    </app-form-field>

    <app-form-field label="Nouveau mot de passe" [required]="true">
      <app-password-input formControlName="password" [showStrength]="true" />
    </app-form-field>

    <app-form-field label="Confirmer le mot de passe" [required]="true"
      [error]="form.hasError('passwordMismatch') ? 'Les mots de passe ne correspondent pas' : ''">
      <app-password-input formControlName="passwordConfirmation" placeholder="Confirmez le mot de passe" />
    </app-form-field>

    <app-button type="submit" variant="primary" [fullWidth]="true" [loading]="isLoading" [disabled]="form.invalid">
      Réinitialiser
    </app-button>
  </form>

  <p class="auth-footer-text">
    <a routerLink="/auth/login" class="auth-link">← Retour à la connexion</a>
  </p>
</div>
