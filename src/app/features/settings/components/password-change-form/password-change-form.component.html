<form [formGroup]="form" (ngSubmit)="onSubmit()" class="password-form">
  <app-card>
    <div card-header>
      <h3 class="section-title">Changer le mot de passe</h3>
      <p class="section-desc">Assurez-vous d'utiliser un mot de passe fort et unique.</p>
    </div>

    <div class="form-fields">
      <app-password-input
        label="Mot de passe actuel"
        placeholder="Entrez votre mot de passe actuel"
        formControlName="currentPassword"
        [error]="getError('currentPassword')"
      />

      <app-password-input
        label="Nouveau mot de passe"
        placeholder="Entrez votre nouveau mot de passe"
        formControlName="password"
        [showStrength]="true"
        [error]="getError('password')"
      />

      <app-password-input
        label="Confirmer le mot de passe"
        placeholder="Confirmez votre nouveau mot de passe"
        formControlName="passwordConfirmation"
        [error]="passwordMismatch ? 'Les mots de passe ne correspondent pas' : getError('passwordConfirmation')"
      />
    </div>
  </app-card>

  <div class="form-actions">
    <app-button variant="primary" type="submit" [loading]="isLoading()">
      Mettre à jour le mot de passe
    </app-button>
  </div>
</form>
