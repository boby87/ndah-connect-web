<app-page-header title="Apparence" subtitle="Personnalisez l'apparence de l'application" />

<div class="settings-container">
  <!-- Thème -->
  <app-card>
    <div card-header>
      <h3 class="section-title">Thème</h3>
      <p class="section-desc">Choisissez le thème de l'application.</p>
    </div>
    <div class="theme-grid">
      @for (option of themeOptions; track option.value) {
        <button
          class="theme-card"
          [class.theme-card--active]="currentTheme() === option.value"
          (click)="selectTheme(option.value)"
          type="button"
        >
          <span class="theme-icon">{{ option.icon }}</span>
          <span class="theme-label">{{ option.label }}</span>
          <span class="theme-desc">{{ option.description }}</span>
          @if (currentTheme() === option.value) {
            <span class="theme-check">✓</span>
          }
        </button>
      }
    </div>
  </app-card>

  <!-- Langue -->
  <app-card>
    <div card-header>
      <h3 class="section-title">Langue</h3>
      <p class="section-desc">Sélectionnez la langue de l'interface.</p>
    </div>
    <div class="language-list">
      @for (option of languageOptions; track option.value) {
        <button
          class="language-item"
          [class.language-item--active]="currentLang() === option.value"
          (click)="selectLanguage(option.value)"
          type="button"
        >
          <span class="language-flag">{{ option.flag }}</span>
          <span class="language-label">{{ option.label }}</span>
          @if (currentLang() === option.value) {
            <span class="language-check">✓</span>
          }
        </button>
      }
    </div>
  </app-card>
</div>
