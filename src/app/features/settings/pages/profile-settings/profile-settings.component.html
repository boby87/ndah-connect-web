<app-page-header title="Mon profil" subtitle="Gérez vos informations personnelles" />

<div class="settings-container">
  <!-- Avatar & Info rapide -->
  <app-card>
    <div class="profile-header">
      <app-avatar-upload
        [currentUrl]="user()?.avatarUrl ?? ''"
        [name]="userFullName()"
        (fileSelected)="onAvatarSelected($event)"
      />
      <div class="profile-info">
        <h2 class="profile-name">{{ userFullName() }}</h2>
        <p class="profile-phone">+237 {{ user()?.phoneNumber }}</p>
        @if (user()?.email) {
          <p class="profile-email">{{ user()?.email }}</p>
        }
        <div class="profile-badges">
          <app-badge [variant]="kycVariant">{{ kycLabel }}</app-badge>
        </div>
      </div>
    </div>
  </app-card>

  <!-- Formulaire profil -->
  <app-profile-form
    [user]="user()"
    [isLoading]="isSubmitting()"
    (formSubmit)="onProfileSubmit($event)"
  />
</div>
