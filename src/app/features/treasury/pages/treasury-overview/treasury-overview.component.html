<app-page-header title="Trésorerie" />

<div class="treasury-container">
  @if (isLoading()) {
    <div class="loading-container">
      <app-spinner size="lg" />
    </div>
  } @else {
    <div class="treasury-grid">
      <app-card class="treasury-card" (click)="navigateToCashBoxes()">
        <div class="card-body">
          <h3 class="card-title">Caisses</h3>
          <p class="card-description">Gérer les caisses de la tontine</p>
        </div>
      </app-card>
      <app-card class="treasury-card" (click)="navigateToTransactions()">
        <div class="card-body">
          <h3 class="card-title">Transactions</h3>
          <p class="card-description">Voir l'historique des transactions</p>
        </div>
      </app-card>
    </div>
  }
</div>
