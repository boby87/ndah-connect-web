@if (label()) {
  <label class="phone-label">{{ label() }}</label>
}
<div class="phone-field" [class.phone-error]="error()" [class.phone-disabled]="isDisabled()">
  <span class="phone-prefix">+237</span>
  <input
    type="tel"
    class="phone-input"
    [value]="formatted"
    [disabled]="isDisabled()"
    placeholder="6XX XX XX XX"
    maxlength="13"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</div>
@if (error()) {
  <span class="phone-error-msg">{{ error() }}</span>
}
