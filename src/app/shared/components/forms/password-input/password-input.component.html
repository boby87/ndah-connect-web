@if (label()) {
  <label class="password-label">{{ label() }}</label>
}
<div class="password-field" [class.password-error]="error()">
  <input
    [type]="isVisible() ? 'text' : 'password'"
    class="password-input"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  <button type="button" class="password-toggle" (click)="toggleVisibility()" tabindex="-1">
    {{ isVisible() ? '🙈' : '👁' }}
  </button>
</div>
@if (showStrength() && value()) {
  <div class="strength-bar">
    <div class="strength-fill" [class]="'strength-' + strength" [style.width.%]="strength * 25"></div>
  </div>
  <span class="strength-label">{{ strengthLabel }}</span>
}
@if (error()) {
  <span class="password-error-msg">{{ error() }}</span>
}
