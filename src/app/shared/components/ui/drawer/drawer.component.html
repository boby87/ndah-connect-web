@if (isOpen()) {
  <div class="drawer-backdrop" (click)="onBackdropClick()"></div>
  <div [class]="'drawer drawer-' + position() + ' drawer-' + size()">
    <div class="drawer-header">
      <h3 class="drawer-title">{{ title() }}</h3>
      <button class="drawer-close" (click)="close()" type="button">&times;</button>
    </div>
    <div class="drawer-body">
      <ng-content />
    </div>
  </div>
}
