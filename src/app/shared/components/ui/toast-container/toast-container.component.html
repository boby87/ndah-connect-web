<div class="tc-toast-stack">
  @for (toast of notifications.toasts(); track toast.id) {
    <div [class]="toastClass(toast.kind)" role="status">
      <span class="tc-toast__indicator" aria-hidden="true"></span>
      <div class="tc-toast__body">
        @if (toast.title) {
          <p class="tc-toast__title">{{ toast.title }}</p>
        }
        <p class="tc-toast__message">{{ toast.message }}</p>
      </div>
      <button class="tc-toast__close" type="button" aria-label="Fermer" (click)="notifications.dismiss(toast.id)">×</button>
    </div>
  }
</div>
