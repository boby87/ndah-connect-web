<div class="tc-card" [class.tc-card--soft]="tone() === 'soft'" [class.tc-card--accent]="tone() === 'accent'" [class.tc-card--padded]="padded()">
  @if (eyebrow() || title()) {
    <header class="tc-card__header">
      @if (eyebrow()) {
        <p class="tc-eyebrow">{{ eyebrow() }}</p>
      }
      @if (title()) {
        <h3 class="tc-card__title">{{ title() }}</h3>
      }
      @if (subtitle()) {
        <p class="tc-card__subtitle">{{ subtitle() }}</p>
      }
    </header>
  }
  <ng-content />
</div>
