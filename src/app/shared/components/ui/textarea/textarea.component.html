<div class="tc-field" [class.tc-field--error]="hasError()">
  @if (label()) {
    <label class="tc-field__label" [for]="textareaId">
      {{ label() }}
      @if (required()) {
        <span class="tc-field__required">*</span>
      }
    </label>
  }
  <textarea
    class="tc-field__textarea"
    [id]="textareaId"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="touched.set(true)"
  ></textarea>
  @if (hasError()) {
    <p class="tc-field__error">{{ error() }}</p>
  } @else if (hint()) {
    <p class="tc-field__hint">{{ hint() }}</p>
  }
</div>
