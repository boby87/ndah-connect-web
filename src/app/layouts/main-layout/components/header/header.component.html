<header class="tc-header">
  <button class="tc-header__menu" type="button" aria-label="Basculer le menu" (click)="ui.toggleSidebar()">
    <tc-icon name="menu" [size]="20" />
  </button>

  <div class="tc-header__search">
    <tc-icon name="search" [size]="18" />
    <input type="search" placeholder="Rechercher membres, séances, cotisations…" />
  </div>

  @if (loading.isLoading()) {
    <span class="tc-header__loading">Chargement…</span>
  }

  <div class="tc-notif-wrapper" (click)="$event.stopPropagation()">
    <button
      class="tc-header__icon-btn"
      type="button"
      aria-label="Notifications"
      [attr.aria-expanded]="panelOpen()"
      (click)="togglePanel()"
    >
      <tc-icon name="bell" [size]="18" />
      @if (notifications.hasUnread()) {
        <span class="tc-header__badge" aria-label="{{ notifications.unreadCount() }} notifications non lues">
          {{ notifications.unreadCount() > 99 ? '99+' : notifications.unreadCount() }}
        </span>
      }
    </button>

    @if (panelOpen()) {
      <tc-notification-panel (close)="closePanel()" />
    }
  </div>

  <button class="tc-header__icon-btn" type="button" aria-label="Aide">
    <tc-icon name="help-circle" [size]="18" />
  </button>

  <button class="tc-header__icon-btn" type="button" aria-label="Basculer le thème" (click)="theme.toggle()">
    @if (theme.theme() === 'dark') {
      <tc-icon name="sun" [size]="18" />
    } @else {
      <tc-icon name="moon" [size]="18" />
    }
  </button>

  @if (auth.user(); as user) {
    <div class="tc-header__profile">
      <div class="tc-header__user-text">
        <p class="tc-header__user-name">{{ user.firstName }} {{ user.lastName }}</p>
        <p class="tc-header__user-mail">{{ user.email }}</p>
      </div>
      <span class="tc-header__avatar">{{ user.firstName | initials: user.lastName }}</span>
    </div>
  }
</header>
