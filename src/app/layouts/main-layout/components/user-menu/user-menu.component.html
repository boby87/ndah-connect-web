<div class="user-menu" (click)="toggle()">
  <app-avatar [name]="authStore.userFullName()" size="sm" />
  <span class="user-name">{{ authStore.userFullName() }}</span>
</div>

@if (isOpen()) {
  <div class="user-dropdown">
    <button class="dropdown-item" (click)="goToProfile()" type="button">👤 Profil</button>
    <button class="dropdown-item" (click)="goToProfile()" type="button">⚙️ Paramètres</button>
    <hr class="dropdown-divider" />
    <button class="dropdown-item danger" (click)="logout()" type="button">🔓 Déconnexion</button>
  </div>
}
