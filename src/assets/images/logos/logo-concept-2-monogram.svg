<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Tontine Connect — Monogramme">
  <!--
    Concept 2 — « Monogramme » : T stylisé dans un cercle ouvert.
    Sobre, lisible en favicon, identitaire.
  -->
  <defs>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#faf8ff"/>

  <!-- Cercle ouvert (la boucle se reforme par le nouvel adhérent) -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="url(#ring2)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="430 60" transform="rotate(-100 128 128)"/>

  <!-- Le membre entrant (point ambre sur l'ouverture) -->
  <circle cx="208" cy="100" r="13" fill="#fbbf24"/>

  <!-- T stylisé centré -->
  <g fill="#4c1d95">
    <rect x="80" y="78" width="96" height="18" rx="6"/>
    <rect x="118" y="78" width="20" height="100" rx="6"/>
  </g>
</svg>
